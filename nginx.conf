server {
    listen 80;
    server_name trade4u.soumalya.in;

    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        # Node + React app (Streamlit service removed). Service name matches
        # docker-compose.yml. WebSocket upgrade headers are required for the
        # app's socket.io endpoint at /api/socket.io.
        # Matches both docker-compose.yml (service: web) and
        # docker-compose.full.yml (service: trade4u) — Coolify uses the latter.
        proxy_pass http://trade4u:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    server_name trade4u.soumalya.in;

    ssl_certificate /etc/nginx/certs/trade4u.soumalya.in.pem;
    ssl_certificate_key /etc/nginx/certs/trade4u.soumalya.in-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    location / {
        # Matches both docker-compose.yml (service: web) and
        # docker-compose.full.yml (service: trade4u) — Coolify uses the latter.
        proxy_pass http://trade4u:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}