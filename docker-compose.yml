# Trade4u - Streamlit Web App (Python)
# Original Streamlit interface

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    env_file:
      - .env.full
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-opencode}
    ports:
      - "8501:8501"
    volumes:
      - tradingagents_data:/home/appuser/.tradingagents
      - streamlit_config:/home/appuser/.streamlit
    restart: unless-stopped

volumes:
  tradingagents_data:
  streamlit_config: