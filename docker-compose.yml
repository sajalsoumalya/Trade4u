# Trade4u - Streamlit Web App for Coolify
# Deploy to trade4u.soumalya.in with SSL

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - LLM_PROVIDER=opencode
      - OPENCODE_API_KEY=${OPENCODE_API_KEY}
      - PYTHONUNBUFFERED=1
    env_file:
      - .env.full