# Trade4u - Complete Trading Platform
# Node.js + Python AI + WebSocket Server

services:
  # Main Web Application (React + Node.js)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env.full
    environment:
      - NODE_ENV=production
      - PORT=8501
      - LLM_PROVIDER=opencode
      # Must match the mount target below. Without it db.js resolves to
      # /app/server/data, which is inside the container and lost on redeploy.
      - DATA_DIR=/app/data
    volumes:
      # Persistent host storage: the container is disposable, this path is not.
      # Override for a local run with TRADE4U_STORAGE=./data docker compose up.
      - ${TRADE4U_STORAGE:-/mnt/imdaa-storage/trade4u}:/app/data
    networks:
      - trade4u

networks:
  trade4u:
    driver: bridge