# Trade4u - Complete Trading Platform
# Node.js + Python AI + WebSocket Server

services:
  # Main Web Application (React + Node.js)
  web:
    build:
      context: .
      dockerfile: Dockerfile.full
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env.full
    environment:
      - NODE_ENV=production
      - PORT=8501
      - LLM_PROVIDER=opencode
    volumes:
      - ./data:/app/data
    networks:
      - trade4u

networks:
  trade4u:
    driver: bridge