# Trade4u Full Stack - Docker Compose for Coolify
# Deploy to trade4u.soumalya.in with Coolify proxy (automatic SSL)

services:
  trade4u:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env.full
    environment:
      - NODE_ENV=production
      - PORT=8501
      - LLM_PROVIDER=opencode
      - DATA_DIR=/app/data
    volumes:
      - /mnt/trade4u-storage/trade4u:/app/data