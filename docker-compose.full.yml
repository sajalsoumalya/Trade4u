# Trade4u Full Stack - Docker Compose for Coolify
# Deploy to trade4u.soumalya.in with Coolify proxy (automatic SSL)

services:
  trade4u:
    build:
      context: .
      dockerfile: Dockerfile.full
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env.full
    environment:
      - NODE_ENV=production
      - PORT=3001
      - LLM_PROVIDER=opencode