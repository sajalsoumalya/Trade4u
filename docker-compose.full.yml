# Trade4u Full Stack - Docker Compose for Coolify
# Deploy to trade4u.soumalya.in with Coolify proxy (automatic SSL)

services:
  trade4u:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8501:8501"
    env_file:
      - .env.full
    environment:
      - NODE_ENV=production
      - PORT=8501
      - LLM_PROVIDER=opencode
      # Must match the mount target below. Without it db.js falls back to
      # /app/server/data — inside the container, so wiped on every redeploy.
      - DATA_DIR=/app/data
    volumes:
      # Host storage lives outside the container image, so rebuilding and
      # redeploying replaces the app but never touches app.db.
      - /mnt/imdaa-storage/trade4u:/app/data